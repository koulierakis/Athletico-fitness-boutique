name: Sync Google Reviews

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync reviews from Google Business Profile
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: node scripts/sync-google-reviews.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- assets/data/google-reviews.json; then
            echo "No review changes."
            exit 0
          fi
          git config user.name "athletico-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/google-reviews.json
          git commit -m "reviews: sync Google Business Profile feed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
