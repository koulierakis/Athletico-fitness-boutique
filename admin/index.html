<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Athletico Visual Admin</title><style>:root{--bg:#0b0d10;--panel:#13171c;--line:#293038;--text:#f1efe9;--muted:#9aa2aa;--accent:#d7dde2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}.panel{border-right:1px solid var(--line);padding:22px;overflow:auto;height:100vh}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:.78rem;letter-spacing:.16em}.badge{font-size:.68rem;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px}.group{border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;background:var(--panel)}h2{font-family:Georgia,serif;font-weight:400;font-size:1.45rem;margin:0 0 14px}label{display:grid;gap:7px;color:var(--muted);font-size:.78rem;margin:0 0 12px}input,textarea,select{width:100%;background:#0d1115;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}textarea{min-height:82px;resize:vertical}.range{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--bg) 25%)}button,.filebtn{border:1px solid var(--line);background:#171c22;color:var(--text);padding:12px 14px;border-radius:999px;cursor:pointer;text-align:center;font-size:.78rem}.primary{background:var(--accent);color:#111;border-color:var(--accent)}.danger{color:#f0b4b4}.preview{display:flex;flex-direction:column;min-width:0}.toolbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.devices{display:flex;gap:8px}.devices button.active{background:#e8ecef;color:#111}.stage{flex:1;display:grid;place-items:center;padding:18px;background:#080a0c;overflow:auto}iframe{width:100%;height:calc(100vh - 100px);border:1px solid #222a32;border-radius:18px;background:white;box-shadow:0 20px 70px rgba(0,0,0,.45);transition:.25s}.phone iframe{width:390px}.tablet iframe{width:820px}.desktop iframe{width:100%}.note{font-size:.72rem;color:var(--muted);line-height:1.5;margin-top:10px}.status{font-size:.72rem;color:#b8c9b8}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{height:auto;border-right:0;border-bottom:1px solid var(--line)}.preview{min-height:720px}.stage{padding:8px}.phone iframe{width:100%}}</style></head><body><div class="app"><aside class="panel"><div class="top"><div class="brand">ATHLETICO VISUAL ADMIN</div><span class="badge">LIVE PREVIEW</span></div><div class="group"><h2>Αρχική εικόνα</h2><label>Μικρός τίτλος<input data-field="heroEyebrow"></label><label>Κεντρικός τίτλος<input data-field="heroTitle"></label><label>Κείμενο<textarea data-field="heroText"></textarea></label><label>Φωτογραφία reception<input type="file" accept="image/*" data-image="heroImage"></label><label>Μέγεθος τίτλου<div class="range"><input type="range" min="42" max="118" data-design="heroTitleSize"><output data-output="heroTitleSize"></output></div></label><label>Καμπύλη φωτογραφίας<div class="range"><input type="range" min="0" max="50" data-design="heroFrameRadius"><output data-output="heroFrameRadius"></output></div></label></div><div class="group"><h2>Φιλοσοφία</h2><label>Τίτλος<textarea data-field="philosophyTitle"></textarea></label><label>Κύριο κείμενο<textarea data-field="philosophyLead"></textarea></label><label>Δευτερεύον<textarea data-field="philosophyText"></textarea></label></div><div class="group"><h2>Υπηρεσίες</h2><label>Τίτλος ενότητας<textarea data-field="servicesTitle"></textarea></label><div id="services"></div><label>Καμπύλη καρτών<div class="range"><input type="range" min="0" max="50" data-design="cardRadius"><output data-output="cardRadius"></output></div></label></div><div class="group"><h2>Why Athletico</h2><label>Τίτλος<textarea data-field="whyTitle"></textarea></label><label>01<input data-field="why1"></label><label>02<input data-field="why2"></label><label>03<input data-field="why3"></label><label>04<input data-field="why4"></label><label>05<input data-field="why5"></label></div><div class="actions"><button class="primary" id="save">ΑΠΟΘΗΚΕΥΣΗ</button><button id="reset" class="danger">ΕΠΑΝΑΦΟΡΑ</button><button id="export">EXPORT JSON</button><label class="filebtn">IMPORT JSON<input id="import" type="file" accept="application/json" hidden></label></div><p class="note">Οι αλλαγές αποθηκεύονται άμεσα σε αυτόν τον browser για ασφαλές preview. Το Export JSON κρατά αντίγραφο των ρυθμίσεων. Η τελική online δημοσίευση θα συνδεθεί σε μόνιμο storage στο επόμενο στάδιο.</p></aside><section class="preview"><div class="toolbar"><div class="devices"><button data-device="phone">Mobile</button><button data-device="tablet">Tablet</button><button data-device="desktop" class="active">Desktop</button></div><span class="status" id="status">Έτοιμο</span></div><div class="stage desktop" id="stage"><iframe id="preview" src="../index.html?admin-preview=1"></iframe></div></section></div><script>const KEY='athleticoCMS_v1';const defaults={content:{heroEyebrow:'WELLNESS CENTER · ΤΡΙΚΑΛΑ · ΑΠΟ ΤΟ 2000',heroTitle:'Η εμπειρία Athletico.',heroText:'Ένας boutique χώρος όπου η κίνηση, η προσωπική φροντίδα και η ευεξία συναντιούνται.',philosophyTitle:'Δεν προσφέρουμε απλώς άσκηση.',philosophyLead:'Δημιουργούμε προσωπικές εμπειρίες ευεξίας.',philosophyText:'Κίνηση με σκοπό. Φροντίδα με συνέπεια.',servicesTitle:'Επτά εμπειρίες.<br>Ένας προσωπικός ρυθμός.',whyTitle:'Η διαφορά βρίσκεται<br>στη φροντίδα.',why1:'Ελευθερία προγραμματισμού',why2:'Εξειδικευμένη καθοδήγηση',why3:'Ολιγομελή τμήματα',why4:'Άνετοι χώροι',why5:'Προγράμματα στα μέτρα σου'},images:{},design:{heroTitleSize:88,heroFrameRadius:28,cardRadius:26}};const serviceData=[['Personal Performance','Προσωπική καθοδήγηση με συνέπεια και σκοπό.'],['Circuit Balance','Κίνηση, ρυθμός και ισορροπία σε ολιγομελή εμπειρία.'],['Core Energy','Δύναμη, έλεγχος και ενέργεια.'],['Pilates Harmony','Αρμονία σώματος και πνεύματος.'],['Vacu Move','Μια σύγχρονη εμπειρία κίνησης και αναζωογόνησης.'],['Wireless EMS — AQ8','Τεχνολογία και εξατομικευμένη καθοδήγηση.'],['Solarium','Χρόνος αφιερωμένος στην προσωπική περιποίηση.']];serviceData.forEach((s,i)=>{defaults.content[`service${i+1}Title`]=s[0];defaults.content[`service${i+1}Text`]=s[1]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)};state={content:{...defaults.content,...(state.content||{})},images:state.images||{},design:{...defaults.design,...(state.design||{})}};const services=document.getElementById('services');serviceData.forEach((_,i)=>{const n=i+1;services.insertAdjacentHTML('beforeend',`<div style="border-top:1px solid #293038;padding-top:12px;margin-top:12px"><label>${String(n).padStart(2,'0')} τίτλος<input data-field="service${n}Title"></label><label>Κείμενο<textarea data-field="service${n}Text"></textarea></label><label>Φωτογραφία<input type="file" accept="image/*" data-image="service${n}Image"></label></div>`)});function load(){document.querySelectorAll('[data-field]').forEach(el=>el.value=state.content[el.dataset.field]||'');document.querySelectorAll('[data-design]').forEach(el=>{el.value=state.design[el.dataset.design];const out=document.querySelector(`[data-output="${el.dataset.design}"]`);if(out)out.textContent=el.value+'px'})}function persist(msg='Αποθηκεύτηκε'){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('status').textContent=msg;document.getElementById('preview').contentWindow.location.reload()}document.addEventListener('input',e=>{if(e.target.dataset.field){state.content[e.target.dataset.field]=e.target.value;persist('Live αλλαγή')}if(e.target.dataset.design){state.design[e.target.dataset.design]=Number(e.target.value);document.querySelector(`[data-output="${e.target.dataset.design}"]`).textContent=e.target.value+'px';persist('Live αλλαγή')}});document.addEventListener('change',e=>{if(e.target.dataset.image&&e.target.files?.[0]){const r=new FileReader();r.onload=()=>{state.images[e.target.dataset.image]=r.result;persist('Η φωτογραφία άλλαξε')};r.readAsDataURL(e.target.files[0])}});document.getElementById('save').onclick=()=>persist();document.getElementById('reset').onclick=()=>{if(confirm('Να επανέλθουν όλες οι αλλαγές;')){localStorage.removeItem(KEY);state=structuredClone(defaults);load();persist('Έγινε επαναφορά')}};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-device]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('stage').className='stage '+b.dataset.device});document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='athletico-content.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('import').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);load();persist('Έγινε import')}catch{alert('Μη έγκυρο JSON')}};r.readAsText(f)};load();</script></body></html>
